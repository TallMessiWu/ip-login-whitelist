<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="apply_title">申请加入白名单 · SSH IP 白名单</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .fade-in { animation: fadeIn .25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

  <!-- 语言切换 -->
  <div class="fixed top-4 right-4 z-50">
    <div class="relative" id="lang-dropdown">
      <button onclick="toggleLangMenu()"
        class="flex items-center gap-1.5 bg-white border border-slate-200 hover:border-slate-300 rounded-lg px-3 py-1.5 text-xs font-medium text-slate-600 hover:text-slate-800 shadow-sm transition-colors">
        <i class="fas fa-globe text-slate-400"></i>
        <span id="current-lang-label">{{ lang.upper() }}</span>
        <i class="fas fa-chevron-down text-slate-400 text-[10px]"></i>
      </button>
      <div id="lang-menu" class="hidden absolute right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-lg py-1 w-28 z-50">
        <button onclick="switchLang('zh')" class="w-full text-left px-3 py-1.5 text-xs hover:bg-slate-50 flex items-center justify-between">
          中文 <span class="text-slate-300 text-[10px]">{{ '✓' if lang == 'zh' else '' }}</span>
        </button>
        <button onclick="switchLang('ru')" class="w-full text-left px-3 py-1.5 text-xs hover:bg-slate-50 flex items-center justify-between">
          Русский <span class="text-slate-300 text-[10px]">{{ '✓' if lang == 'ru' else '' }}</span>
        </button>
        <button onclick="switchLang('en')" class="w-full text-left px-3 py-1.5 text-xs hover:bg-slate-50 flex items-center justify-between">
          English <span class="text-slate-300 text-[10px]">{{ '✓' if lang == 'en' else '' }}</span>
        </button>
      </div>
    </div>
  </div>

  <div class="w-full max-w-sm fade-in">
    <!-- Logo -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg mb-3">
        <i class="fas fa-file-signature text-white text-2xl"></i>
      </div>
      <h1 class="text-xl font-bold text-slate-800" data-i18n="apply_heading">申请加入白名单</h1>
      <p class="text-sm text-slate-400 mt-1" data-i18n="apply_subtitle">提交后需等待管理员审核</p>
    </div>

    <!-- 表单卡片 -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
      <div id="err-box" class="hidden mb-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-4 py-2.5">
        <i class="fas fa-circle-xmark mr-1.5"></i><span id="err-msg"></span>
      </div>
      <div id="ok-box" class="hidden mb-4 text-sm text-green-600 bg-green-50 border border-green-200 rounded-lg px-4 py-2.5">
        <i class="fas fa-circle-check mr-1.5"></i><span id="ok-msg"></span>
      </div>

      <div class="space-y-4">
        <!-- IP 输入 -->
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1.5">
            <span data-i18n="apply_ip_label">你的 IP / CIDR</span> <span class="text-red-400">*</span>
            <button onclick="autoDetectIP()" class="ml-1 text-blue-500 hover:text-blue-700 text-xs font-normal">
              <i class="fas fa-magnifying-glass mr-0.5"></i><span data-i18n="apply_auto_detect">自动检测</span>
            </button>
          </label>
          <input id="ip" type="text" placeholder="192.168.1.100 或 10.0.0.0/24"
            class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition font-mono">
        </div>

        <!-- 姓名 + 工号 -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1.5"><span data-i18n="apply_name_label">姓名</span> <span class="text-red-400">*</span></label>
            <input id="name" type="text" data-i18n-placeholder="apply_name_label"
              class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1.5"><span data-i18n="apply_employee_id_label">工号</span> <span class="text-red-400">*</span></label>
            <input id="employee-id" type="text" data-i18n-placeholder="apply_employee_id_label"
              class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
          </div>
        </div>

        <!-- 使用目的 -->
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1.5"><span data-i18n="apply_purpose_label">使用目的</span> <span class="text-red-400">*</span></label>
          <input id="purpose" type="text" data-i18n-placeholder="apply_purpose_placeholder"
            class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
        </div>

        <!-- 使用时长 -->
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1.5"><span data-i18n="apply_duration_label">使用时长</span> <span class="text-red-400">*</span></label>
          <div class="flex gap-2">
            <select id="duration-preset" onchange="onDurationPresetChange()"
              class="flex-1 border border-slate-300 rounded-lg px-2 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
              <option value="" data-i18n="apply_duration_placeholder">请选择时长</option>
              <option value="1d" data-i18n="apply_duration_1d">1 天</option>
              <option value="3d" data-i18n="apply_duration_3d">3 天</option>
              <option value="7d" data-i18n="apply_duration_7d">7 天</option>
              <option value="30d" data-i18n="apply_duration_30d">30 天</option>
              <option value="90d" data-i18n="apply_duration_90d">90 天</option>
              <option value="custom" data-i18n="apply_duration_custom">自定义...</option>
            </select>
            <input id="duration-custom" type="datetime-local"
              class="hidden flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <p class="mt-1 text-xs text-slate-400">
            <i class="fas fa-circle-info mr-0.5"></i><span data-i18n="apply_duration_hint">选择预设时长时，有效期从审核通过时刻起算；自定义日期则为固定到期时间。不可申请永久。</span>
          </p>
        </div>

        <!-- 服务器多选 -->
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1.5"><span data-i18n="apply_servers_label">选择要加入的服务器（可多选）</span> <span class="text-red-400">*</span></label>
          <div id="server-list" class="max-h-48 overflow-y-auto border border-slate-200 rounded-lg divide-y divide-slate-100">
            <div class="px-3 py-4 text-center text-slate-400 text-sm">
              <i class="fas fa-circle-notch spin mr-1"></i> <span data-i18n="apply_loading_servers">加载服务器列表...</span>
            </div>
          </div>
          <p class="mt-1 text-xs text-slate-400">
            <i class="fas fa-circle-info mr-0.5"></i><span data-i18n="apply_server_hint">只能申请加入服务器专属白名单，不可申请全局白名单</span>
          </p>
        </div>
      </div>

      <button id="submit-btn" onclick="doApply()"
        class="mt-5 w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center justify-center gap-2">
        <i class="fas fa-paper-plane"></i>
        <span data-i18n="apply_submit">提交申请</span>
      </button>

      <div class="mt-4 text-center">
        <a href="/login" class="text-xs text-slate-400 hover:text-slate-600 transition-colors">
          <i class="fas fa-arrow-left mr-1"></i><span data-i18n="guest_back_to_login">返回登录</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    // ── i18n 注入 ──────────────────────────────────────────────────
    window.__LANG = '{{ lang }}';
    window.__I18N = {{ T | tojson }};

    function t(key, params) {
      let s = window.__I18N[key] || key;
      if (params) {
        Object.keys(params).forEach(function(k) { s = s.replace('{' + k + '}', params[k]); });
      }
      return s;
    }

    // 翻译所有 [data-i18n] 元素
    document.querySelectorAll('[data-i18n]').forEach(function(el) {
      var key = el.getAttribute('data-i18n');
      if (key) el.textContent = t(key);
    });
    // 翻译 placeholder
    document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) {
      var key = el.getAttribute('data-i18n-placeholder');
      if (key) el.placeholder = t(key);
    });
    var titleEl = document.querySelector('title[data-i18n]');
    if (titleEl) document.title = t(titleEl.getAttribute('data-i18n'));

    // ── 语言切换 ──────────────────────────────────────────────────
    function toggleLangMenu() {
      document.getElementById('lang-menu').classList.toggle('hidden');
    }
    async function switchLang(lang) {
      try {
        await fetch('/api/lang', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lang: lang }),
        });
        window.location.reload();
      } catch(e) { window.location.reload(); }
    }
    document.addEventListener('click', function(e) {
      var dd = document.getElementById('lang-dropdown');
      if (dd && !dd.contains(e.target)) {
        document.getElementById('lang-menu').classList.add('hidden');
      }
    });

    // ── 申请逻辑 ──────────────────────────────────────────────────
    let servers = [];

    function onDurationPresetChange() {
      const preset = document.getElementById('duration-preset');
      const custom = document.getElementById('duration-custom');
      if (preset.value === 'custom') {
        custom.classList.remove('hidden');
        custom.focus();
      } else {
        custom.classList.add('hidden');
      }
    }

    function getDurationValue() {
      const preset = document.getElementById('duration-preset');
      const custom = document.getElementById('duration-custom');
      if (preset.value === 'custom') return custom.value || '';
      return preset.value;
    }

    async function loadServers() {
      try {
        const res = await fetch('/api/servers-public');
        const data = await res.json();
        servers = data.servers || [];
        renderServerList();
      } catch (e) {
        document.getElementById('server-list').innerHTML =
          '<div class="px-3 py-4 text-center text-red-400 text-sm">' + t('network_error') + '</div>';
      }
    }

    function renderServerList() {
      const el = document.getElementById('server-list');
      if (!servers.length) {
        el.innerHTML = '<div class="px-3 py-4 text-center text-slate-400 text-sm">' + t('apply_no_servers') + '</div>';
        return;
      }
      el.innerHTML = servers.map(s => `
        <label class="flex items-center gap-3 px-3 py-2.5 hover:bg-slate-50 cursor-pointer transition-colors">
          <input type="checkbox" value="${escAttr(s.host)}" class="srv-cb w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
          <div class="flex-1 min-w-0">
            <div class="text-sm text-slate-700 truncate">${escHtml(s.name || s.host)}</div>
            <div class="text-xs text-slate-400">${escHtml(s.host)}:${s.port || 22}</div>
          </div>
        </label>
      `).join('');
    }

    async function autoDetectIP() {
      const btn = document.querySelector('[onclick="autoDetectIP()"]');
      const orig = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-circle-notch spin mr-0.5"></i>' + t('apply_detecting');
      btn.disabled = true;
      try {
        const res = await fetch('/api/check-my-ip');
        const data = await res.json();
        if (data.client_ip && data.client_ip !== '127.0.0.1' && data.client_ip !== '::1') {
          document.getElementById('ip').value = data.client_ip;
        } else {
          showErr(t('apply_cannot_detect'));
        }
      } catch (e) {
        showErr(t('apply_detect_failed'));
      } finally {
        btn.innerHTML = orig;
        btn.disabled = false;
      }
    }

    async function doApply() {
      const ip = document.getElementById('ip').value.trim();
      const name = document.getElementById('name').value.trim();
      const employeeId = document.getElementById('employee-id').value.trim();
      const purpose = document.getElementById('purpose').value.trim();
      const duration = getDurationValue();
      const checked = document.querySelectorAll('.srv-cb:checked');
      const selected = Array.from(checked).map(cb => cb.value);

      hideErr();
      hideOk();

      if (!ip) { showErr(t('apply_fill_ip')); return; }
      if (!name) { showErr(t('apply_fill_name')); return; }
      if (!employeeId) { showErr(t('apply_fill_employee_id')); return; }
      if (!purpose) { showErr(t('apply_fill_purpose')); return; }
      if (!duration) { showErr(t('apply_fill_duration')); return; }
      if (!selected.length) { showErr(t('apply_fill_servers')); return; }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> ' + t('apply_submitting');

      try {
        const res = await fetch('/api/apply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ip, name, employee_id: employeeId, purpose, duration, servers: selected }),
        });
        const data = await res.json();
        if (data.success) {
          showOk(data.message);
          document.getElementById('ip').value = '';
          document.getElementById('name').value = '';
          document.getElementById('employee-id').value = '';
          document.getElementById('purpose').value = '';
          document.getElementById('duration-preset').value = '';
          document.getElementById('duration-custom').classList.add('hidden');
          document.getElementById('duration-custom').value = '';
          document.querySelectorAll('.srv-cb:checked').forEach(cb => cb.checked = false);
        } else {
          showErr(data.message || t('apply_submit_failed'));
        }
      } catch (e) {
        showErr(t('network_error'));
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> ' + t('apply_submit');
      }
    }

    function showErr(msg) {
      document.getElementById('err-msg').textContent = msg;
      document.getElementById('err-box').classList.remove('hidden');
    }
    function hideErr() {
      document.getElementById('err-box').classList.add('hidden');
    }
    function showOk(msg) {
      document.getElementById('ok-msg').textContent = msg;
      document.getElementById('ok-box').classList.remove('hidden');
    }
    function hideOk() {
      document.getElementById('ok-box').classList.add('hidden');
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function escAttr(s) {
      return String(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // 初始化
    document.getElementById('ip').focus();
    loadServers();
  </script>
</body>
</html>
